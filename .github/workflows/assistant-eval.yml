name: Assistant eval

# Runs on every pull request so the `assistant-eval` check always reports and can be a
# required check. The paid model run happens only when files that affect answers changed;
# otherwise the job passes immediately.
on:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assistant-eval:
    runs-on: ubuntu-latest
    steps:
      - id: key
        env:
          KEY: ${{ secrets.OPENAI_API_KEY }}
        run: echo "has_key=${{ env.KEY != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE"...HEAD | grep -qE '^(packages/shared/src/assistant/|packages/shared/src/inventory/|packages/shared/evals/|apps/web/app/api/chat/|content/|\.github/workflows/assistant-eval\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "Assistant eval skipped: no assistant, inventory, eval, chat-route or content changes." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.scope.outputs.relevant == 'true' && steps.key.outputs.has_key == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - if: steps.scope.outputs.relevant == 'true' && steps.key.outputs.has_key == 'true'
        run: npm ci
      - if: steps.scope.outputs.relevant == 'true' && steps.key.outputs.has_key == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ASSISTANT_MODEL: ${{ vars.ASSISTANT_MODEL }}
        run: npm run eval:assistant -w @ahmed-moghazy/shared
      - if: steps.scope.outputs.relevant == 'true' && steps.key.outputs.has_key == 'true' && github.event_name == 'schedule'
        continue-on-error: true
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          ASSISTANT_FALLBACK_MODEL: ${{ vars.ASSISTANT_FALLBACK_MODEL }}
        run: npm run eval:assistant -w @ahmed-moghazy/shared -- --provider fallback
      - if: steps.key.outputs.has_key != 'true'
        run: |
          echo "Assistant eval skipped: no API key (fork PR)" >> "$GITHUB_STEP_SUMMARY"
